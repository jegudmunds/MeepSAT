name: Quality checks

on:
  push:
    branches: [main, code_development]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Install MeepSAT without MEEP-dependent runtime packages
        run: python -m pip install --no-deps --editable .
      - name: Compile package
        run: python -m compileall -q meepsat
      - name: Run unit tests
        run: python -m pytest
